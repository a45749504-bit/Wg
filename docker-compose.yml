version: "3.8"

services:
  wstunnel-vpn:
    build: .
    container_name: wstunnel-wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    ports:
      - "8080:8080"      # WSTunnel (должен совпадать с PORT)
      - "51820:51820/udp" # WireGuard (опционально, если не через wstunnel)
    environment:
      - PORT=8080
      - MODE=auto
      - WG_SUBNET=10.200.200
      - WG_DNS=1.1.1.1,8.8.8.8
      - WG_PORT=51820
      - CLIENTS_COUNT=2
    volumes:
      - ./creds:/app/creds  # Сохраняем ключи между перезапусками
    restart: unless-stopped
