version: "3.8"

services:
  wstunnel-wireguard:
    build: .
    container_name: wstunnel-wg
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
    environment:
      - PORT=8080
      - WSTUNNEL_SECRET=your-very-long-secret-key-here-min-32-chars
      - CLIENT_PUBLIC_KEY=YOUR_CLIENT_PUBLIC_KEY_HERE
    ports:
      - "8080:8080/tcp"
      - "51820:51820/udp"
    restart: unless-stopped
