# ============================================
# WireGuard Client Config
# ============================================
# 1. Замени SERVER_PUBLIC_KEY на ключ из логов Render
# 2. Замени CLIENT_PRIVATE_KEY на ключ из client-setup.sh
# 3. Замени PRESHARED_KEY на ключ из client-setup.sh
# 4. Импортируй в WireGuard app на Android

[Interface]
PrivateKey = CLIENT_PRIVATE_KEY_HERE
Address = 10.200.200.2/24
DNS = 1.1.1.1, 8.8.8.8

[Peer]
PublicKey = SERVER_PUBLIC_KEY_HERE
PresharedKey = PRESHARED_KEY_HERE
AllowedIPs = 0.0.0.0/0, ::/0
Endpoint = 127.0.0.1:51820
PersistentKeepalive = 25
