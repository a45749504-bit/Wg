services:
  - type: web
    name: wstunnel-wireguard
    runtime: docker
    plan: free
    envVars:
      # ═══════════════════════════════════════════════════════════════
      # ОБЯЗАТЕЛЬНЫЕ ПЕРЕМЕННЫЕ
      # ═══════════════════════════════════════════════════════════════

      # WSTUNNEL_SECRET — защитный путь для WebSocket upgrade.
      # Минимум 32 случайных символа. Без него сервер не запустится.
      # Сгенерировать: openssl rand -base64 32
      - key: WSTUNNEL_SECRET
        sync: false

      # CLIENT_PUBLIC_KEY — публичный ключ WireGuard клиента.
      # Получить: wg genkey | tee privatekey | wg pubkey > publickey
      - key: CLIENT_PUBLIC_KEY
        sync: false

      # ═══════════════════════════════════════════════════════════════
      # ОПЦИОНАЛЬНЫЕ ПЕРЕМЕННЫЕ
      # ═══════════════════════════════════════════════════════════════

      # PRESHARED_KEY — дополнительный ключ для post-quantum защиты.
      # Сгенерировать: wg genpsk
      # Если не задан — сгенерируется автоматически.
      - key: PRESHARED_KEY
        sync: false

      # CLIENT_PUBLIC_KEY_2 — публичный ключ второго клиента (опционально)
      - key: CLIENT_PUBLIC_KEY_2
        sync: false

      # CLIENT_PUBLIC_KEY_3 — публичный ключ третьего клиента (опционально)
      - key: CLIENT_PUBLIC_KEY_3
        sync: false

      # WG_PORT — порт WireGuard (default: 51820)
      - key: WG_PORT
        value: "51820"

      # WG_SUBNET — подсеть WireGuard (default: 10.200.200.0/24)
      - key: WG_SUBNET
        value: "10.200.200.0/24"

      # WG_SERVER_IP — IP сервера в подсети (default: 10.200.200.1)
      - key: WG_SERVER_IP
        value: "10.200.200.1"

      # WG_CLIENT_IP — IP первого клиента (default: 10.200.200.2)
      - key: WG_CLIENT_IP
        value: "10.200.200.2"

      # DNS_SERVERS — DNS через запятую (default: 1.1.1.1,8.8.8.8)
      - key: DNS_SERVERS
        value: "1.1.1.1,8.8.8.8"
